# Base de datos PostgreSQL para desarrollo local.
# Levantar:  docker compose up -d db
# El servicio de la app se agrega en la fase de dockerización.
# La contraseña por defecto es solo para desarrollo local; se puede pisar con la
# variable de entorno POSTGRES_PASSWORD (y debe coincidir con appsettings.Development.json).
services:
  db:
    image: postgres:16
    container_name: trazeablock-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trazeablock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trazeablock_dev}
      POSTGRES_DB: trazeablock
    ports:
      - "5432:5432"
    volumes:
      - trazeablock-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trazeablock -d trazeablock"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trazeablock-pgdata:
